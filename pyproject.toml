[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "verified-data-extraction"
version = "0.1.0"
description = "P1 local persistence and workspace substrate"
requires-python = ">=3.11"
dependencies = ["jsonschema==4.26.0", "referencing==0.37.0", "rfc8785==0.1.4", "streamlit==1.50.0"]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"vde.persistence" = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests/p1"]
pythonpath = ["src"]
addopts = "-ra"
